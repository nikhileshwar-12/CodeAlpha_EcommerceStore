<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Stride running shoes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f6ff"/><stop offset="1" stop-color="#c4e4fb"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7fe0"/><stop offset="1" stop-color="#2a54b8"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="290" r="190" fill="#ffffff" opacity=".38"/>
  <ellipse cx="300" cy="452" rx="160" ry="24" fill="#0b1224" opacity=".10"/>

  <!-- upper -->
  <path d="M150 382c-10-44 4-76 40-92l70-32c26-12 46-28 62-48 14-17 38-24 60-16l56 22c20 8 33 26 34 48l4 118z" fill="url(#up)"/>
  <!-- toe cap -->
  <path d="M150 382c-10-42 3-73 36-90l42-20 44 110z" fill="#6f9bf0" opacity=".85"/>
  <!-- ankle collar -->
  <path d="M352 216l56-16c18-5 36 6 40 24l6 26-92 24z" fill="#1f418f"/>
  <!-- heel counter -->
  <path d="M420 254l44-14c18-6 32 8 32 26l4 116h-78z" fill="#24489c"/>
  <!-- swoosh / side stripe -->
  <path d="M188 350c56 14 116 10 172-14 34-14 62-16 84-6" stroke="#a9c8ff" stroke-width="14" fill="none" stroke-linecap="round" opacity=".9"/>
  <!-- laces -->
  <g stroke="#eaf2ff" stroke-width="10" stroke-linecap="round">
    <path d="M300 272l28 20"/><path d="M322 250l28 20"/><path d="M344 230l26 20"/>
  </g>
  <!-- tongue -->
  <path d="M318 214l40-14 14 34-46 16z" fill="#1f418f" opacity=".8"/>
  <!-- midsole -->
  <path d="M146 374h346c14 0 25 12 25 27s-11 28-25 28H180c-24 0-42-16-42-38 0-10 3-17 8-17z" fill="#f4f8ff"/>
  <!-- outsole -->
  <path d="M138 418h379c0 18-12 30-30 30H178c-24 0-40-13-40-30z" fill="#cfdcef"/>
  <!-- tread notches -->
  <g stroke="#b4c6de" stroke-width="7" stroke-linecap="round">
    <path d="M196 430v12m52-12v12m52-12v12m52-12v12m52-12v12"/>
  </g>
  <!-- accent dot -->
  <circle cx="252" cy="330" r="11" fill="#ff8a3d"/>
</svg>
