<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="NovaCart — modern e-commerce storefront">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a2a"/>
      <stop offset="0.55" stop-color="#1d2450"/>
      <stop offset="1" stop-color="#2b1f5e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf70"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b7cfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b7cfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="1120" cy="70" r="300" fill="url(#glow1)"/>
  <circle cx="1180" cy="350" r="260" fill="url(#glow2)"/>
  <circle cx="150" cy="360" r="220" fill="url(#glow1)"/>

  <!-- grid texture -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 80h1280M0 160h1280M0 240h1280M0 320h1280"/>
    <path d="M160 0v400M320 0v400M480 0v400M640 0v400M800 0v400M960 0v400M1120 0v400"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(84, 116)">
    <rect width="88" height="88" rx="24" fill="url(#brand)"/>
    <path d="M22 28h7l7 31h30l6-22H34" fill="none" stroke="#fff" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="41" cy="70" r="4.6" fill="#fff"/>
    <circle cx="59" cy="70" r="4.6" fill="#fff"/>
  </g>

  <!-- wordmark -->
  <text x="196" y="163" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff" letter-spacing="-2">Nova<tspan fill="#9db2ff">Cart</tspan></text>
  <text x="198" y="205" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#a8b3cf" letter-spacing="-0.2">Modern e-commerce storefront · filtering, cart, coupons &amp; checkout</text>

  <!-- tech pills -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="198" y="238" width="150" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="273" y="265" fill="#dfe6ff" text-anchor="middle">HTML5</text>

    <rect x="360" y="238" width="126" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="423" y="265" fill="#dfe6ff" text-anchor="middle">CSS3</text>

    <rect x="498" y="238" width="196" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="596" y="265" fill="#dfe6ff" text-anchor="middle">Vanilla JS</text>

    <rect x="706" y="238" width="196" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="804" y="265" fill="#dfe6ff" text-anchor="middle">No build step</text>
  </g>

  <text x="198" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#7c88a8">54 automated UI checks · 14 products · responsive, accessible, dark-mode ready</text>

  <!-- cart illustration -->
  <g transform="translate(920, 96)">
    <circle cx="120" cy="120" r="128" fill="#ffffff" fill-opacity="0.05"/>
    <path d="M32 44h20l22 96c2.6 11 12 19 23 19h84c11 0 20-7 23-17l17-57H62" fill="none" stroke="#7f97ff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="105" cy="188" r="15" fill="#7f97ff"/>
    <circle cx="176" cy="188" r="15" fill="#7f97ff"/>
    <rect x="126" y="44" width="84" height="82" rx="15" fill="url(#warm)"/>
    <path d="M168 44V32a16 16 0 0 0-32 0" fill="none" stroke="#e07a2c" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <path d="M880 74l9 19 19 9-19 9-9 19-9-19-19-9 19-9z" fill="#ffcf70" opacity="0.9"/>
  <path d="M1252 220l7 15 15 7-15 7-7 15-7-15-15-7 15-7z" fill="#8b5cf6" opacity="0.75"/>
  <circle cx="860" cy="330" r="7" fill="#5b7cfa" opacity="0.8"/>
</svg>
